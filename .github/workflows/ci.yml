name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: valor_test
          POSTGRES_USER: valor
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valor -d valor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VALOR_DATABASE__URL: postgresql+psycopg://valor:test-only@localhost:5432/valor_test
      VALOR_TEST_DATABASE_URL: postgresql+psycopg://valor:test-only@localhost:5432/valor_test
      VALOR_SECURITY__MANAGEMENT_PRINCIPAL_ID: ci-management
      VALOR_SECURITY__MANAGEMENT_TOKEN: test-only-ci-management-token-32-bytes
      VALOR_SECURITY__MANAGEMENT_TENANT_IDS: '[]'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest --no-cov tests/architecture
      - run: uv run pytest --no-cov tests/unit
      - run: uv run pytest --no-cov tests/integration
      - run: uv run pytest
      - run: uv build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: valor-control-plane:ci
