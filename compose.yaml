services:
  api:
    build: .
    environment:
      VALOR_APPLICATION__ENVIRONMENT: local
      VALOR_DATABASE__URL: postgresql+psycopg://valor:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/valor
      VALOR_OBSERVABILITY__LOG_JSON: "true"
      VALOR_PROVIDER__OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VALOR_PROVIDER__TIMEOUT_SECONDS: "30"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valor
      POSTGRES_USER: valor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valor -d valor"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
